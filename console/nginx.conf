# Standalone fallback config. In a real deployment the chart mounts
# a ConfigMap over /etc/nginx/conf.d/default.conf with per-service
# routing (see charts/dcloud/templates/console-nginx-config.yaml); this
# file is what the image serves if you run it plain, e.g. for smoke
# testing the built SPA.
server {
  listen 8080 default_server;
  server_name _;
  absolute_redirect off;
  port_in_redirect off;
  client_max_body_size 10g;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
