apiVersion: batch/v1
kind: Job
metadata:
  # ArgoCD only reruns a hook Job when its name changes; sha of the
  # migrate image gives us that.
  name: {{ include "dcloud.fullname" . }}-db-migrate-{{ .Values.image.tag | default .Chart.AppVersion | sha256sum | trunc 8 }}
  labels:
    {{- include "dcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    # sync-wave puts the migration between the bundled postgres install
    # (wave 0, from the sub-chart) and the dcloud services (wave 2).
    # PostSync would block on the dcloud service Deployments becoming
    # Healthy, but those Deployments can't be Healthy until this
    # migration runs — classic circular wait. Sync-wave lets the Job
    # run mid-Sync as soon as postgres is Applied.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "dcloud.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: {{ include "dcloud.image" (dict "root" . "repository" "db-migrate") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "dcloud.fullname" . }}-database
