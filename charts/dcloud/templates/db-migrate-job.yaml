apiVersion: batch/v1
kind: Job
metadata:
  # ArgoCD only reruns a hook Job when its name changes; sha of the
  # migrate image gives us that.
  name: {{ include "dcloud.fullname" . }}-db-migrate-{{ .Values.image.tag | default .Chart.AppVersion | sha256sum | trunc 8 }}
  labels:
    {{- include "dcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    # Helm-style post-install hooks do not fire under ArgoCD, so we use
    # the argocd-native PostSync hook: it fires after the Sync phase
    # applies (and creates) the bundled postgresql-ha StatefulSet, which
    # PreSync would race with when the umbrella chart owns Postgres too.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "dcloud.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: {{ include "dcloud.image" (dict "root" . "repository" "db-migrate") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "dcloud.fullname" . }}-database
