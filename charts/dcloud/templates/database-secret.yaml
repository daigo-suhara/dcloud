{{- /*
Auto-managed database secret.

On first install this template generates a random 32-character password
and derives every credential the bitnami postgresql-ha sub-chart and
the dcloud services need. On subsequent `helm upgrade` calls the
existing secret is looked up and its password preserved so pods do not
need to restart.

Users who prefer to bring their own credentials can set
`.Values.database.externalSecret` to the name of a pre-created Secret
in the release namespace; this template is then skipped.

Keys produced:
  password             (dcloud postgres user)
  postgres-password    (postgres superuser)
  repmgr-password      (bitnami HA replication user)
  sr-check-password    (bitnami HA streaming check user)
  admin-password       (bitnami pgpool admin user)
  DCLD_DATABASE_URL           (services runtime read/write via pgpool)
  DCLD_DATABASE_MIGRATION_URL (db-migrate Job - direct to primary)
*/}}
{{- if not .Values.database.externalSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "dcloud-database" -}}
{{- $password := "" -}}
{{- if $existing -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- $url := printf "postgresql://dcloud:%s@%s-postgresql-ha-pgpool:5432/dcloud?sslmode=disable" $password .Release.Name -}}
{{- $migrationURL := printf "postgresql://dcloud:%s@%s-postgresql-ha-postgresql:5432/dcloud?sslmode=disable" $password .Release.Name -}}
apiVersion: v1
kind: Secret
metadata:
  name: dcloud-database
  labels:
    {{- include "dcloud.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from recreating (and thereby rotating) the password
    # on every upgrade - rotation should be an explicit operation.
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  password: {{ $password | quote }}
  postgres-password: {{ $password | quote }}
  repmgr-password: {{ $password | quote }}
  sr-check-password: {{ $password | quote }}
  admin-password: {{ $password | quote }}
  DCLD_DATABASE_URL: {{ $url | quote }}
  DCLD_DATABASE_MIGRATION_URL: {{ $migrationURL | quote }}
{{- end -}}
