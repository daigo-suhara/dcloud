{{- /*
Auto-managed database secret.

Generates a random 32-character password on first install and preserves
it on subsequent upgrades via a lookup + resource-policy=keep. CNPG's
Cluster resource in postgres-cluster.yaml reads the same secret via
bootstrap.initdb.secret so postgres and every dcloud service share one
source of truth.

kubernetes.io/basic-auth is required by CNPG for bootstrap.initdb.secret;
the DCLD_* keys are consumed by the dcloud services (envFrom).

Users who prefer to bring their own credentials can set
`.Values.database.externalSecret` to the name of a pre-created Secret
in the release namespace; this template is then skipped.
*/}}
{{- if not .Values.database.externalSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "dcloud-database" -}}
{{- $password := "" -}}
{{- if $existing -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- $url := printf "postgresql://dcloud:%s@dcloud-db-rw:5432/dcloud?sslmode=disable" $password -}}
apiVersion: v1
kind: Secret
metadata:
  name: dcloud-database
  labels:
    {{- include "dcloud.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: kubernetes.io/basic-auth
stringData:
  username: dcloud
  password: {{ $password | quote }}
  DCLD_DATABASE_URL: {{ $url | quote }}
  DCLD_DATABASE_MIGRATION_URL: {{ $url | quote }}
{{- end -}}
