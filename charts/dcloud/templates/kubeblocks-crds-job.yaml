{{- if .Values.kubeblocks.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeblocks-crds-installer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeblocks-crds-installer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubeblocks-crds-installer
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubeblocks-crds-installer-{{ .Values.kubeblocks.version | sha256sum | trunc 8 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: kubeblocks-crds-installer
      restartPolicy: Never
      containers:
        - name: apply
          image: bitnami/kubectl:1.34
          command: [/bin/sh, -c]
          args:
            - |
              set -eux
              kubectl apply --server-side --force-conflicts \
                -f https://github.com/apecloud/kubeblocks/releases/download/v{{ .Values.kubeblocks.version }}/kubeblocks_crds.yaml
{{- end }}
