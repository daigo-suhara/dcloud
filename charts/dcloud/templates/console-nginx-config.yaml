apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dcloud.fullname" . }}-console-nginx
  labels:
    {{- include "dcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  default.conf: |
    # The public dcloud console. Each /api/v1/<service>/ prefix is
    # routed straight to the owning Go service (identity, project,
    # container, compute, storage, database) since the Python api
    # gateway has been retired. All services listen h2c so
    # HTTP/1.1 keepalive plus WebSocket upgrade work as-is.
    #
    # Tenant `*.<publicServiceDomain>` routing is intentionally not
    # done here anymore. The outer Ingress (see console-ingress.yaml)
    # sends that traffic straight to istio-ingressgateway.
    server {
      listen 8080 default_server;
      server_name _;
      absolute_redirect off;
      port_in_redirect off;
      client_max_body_size 10g;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      # identity: /api/v1/auth/*
      location /api/v1/auth/ {
        proxy_pass http://{{ include "dcloud.fullname" . }}-identity:8093;
        include /etc/nginx/dcloud-proxy.conf;
      }

      # project: /api/v1/projects and /api/v1/projects/*
      location = /api/v1/projects {
        proxy_pass http://{{ include "dcloud.fullname" . }}-project:8091;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location /api/v1/projects/ {
        proxy_pass http://{{ include "dcloud.fullname" . }}-project:8091;
        include /etc/nginx/dcloud-proxy.conf;
      }

      # container
      location = /api/v1/container {
        proxy_pass http://{{ include "dcloud.fullname" . }}-container:8092;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location /api/v1/container/ {
        proxy_pass http://{{ include "dcloud.fullname" . }}-container:8092;
        include /etc/nginx/dcloud-proxy.conf;
      }

      # compute (also handles /api/v1/compute/{name}/console WebSocket)
      location = /api/v1/compute {
        proxy_pass http://{{ include "dcloud.fullname" . }}-compute:8094;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location /api/v1/compute/ {
        proxy_pass http://{{ include "dcloud.fullname" . }}-compute:8094;
        include /etc/nginx/dcloud-proxy.conf;
      }

      # storage (bucket-level via REST + object-level via s3_proxy)
      location = /api/v1/storage {
        proxy_pass http://{{ include "dcloud.fullname" . }}-storage:8095;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location /api/v1/storage/ {
        proxy_pass http://{{ include "dcloud.fullname" . }}-storage:8095;
        include /etc/nginx/dcloud-proxy.conf;
      }

      # database
      location = /api/v1/database {
        proxy_pass http://{{ include "dcloud.fullname" . }}-database:8096;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location /api/v1/database/ {
        proxy_pass http://{{ include "dcloud.fullname" . }}-database:8096;
        include /etc/nginx/dcloud-proxy.conf;
      }

      # operations - route by ID prefix to the owning service.
      location ~ ^/api/v1/operations/container-op- {
        proxy_pass http://{{ include "dcloud.fullname" . }}-container:8092;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location ~ ^/api/v1/operations/compute-op- {
        proxy_pass http://{{ include "dcloud.fullname" . }}-compute:8094;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location ~ ^/api/v1/operations/storage-op- {
        proxy_pass http://{{ include "dcloud.fullname" . }}-storage:8095;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location ~ ^/api/v1/operations/database-op- {
        proxy_pass http://{{ include "dcloud.fullname" . }}-database:8096;
        include /etc/nginx/dcloud-proxy.conf;
      }
      location ~ ^/api/v1/operations/project-op- {
        proxy_pass http://{{ include "dcloud.fullname" . }}-project:8091;
        include /etc/nginx/dcloud-proxy.conf;
      }
    }
  dcloud-proxy.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
