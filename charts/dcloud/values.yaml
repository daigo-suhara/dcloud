image:
  registry: ghcr.io
  # Container registry namespace (org or user) under which the dcloud
  # component images are published. Override for private mirrors or forks.
  repositoryOwner: dcloud
  pullPolicy: Always
  tag: latest

# Public DNS zone that tenant container services are exposed under
# (e.g. hello.example.com resolves to the Knative service). Override to
# your own zone.
publicServiceDomain: example.com

# --- Platform dependency toggles --------------------------------------------
# Each block below controls a bundled sub-chart (see Chart.yaml `dependencies`)
# and any static manifests rendered under templates/inline-manifests.yaml.
# Set `enabled: false` to bring your own installation of that component;
# dcloud then assumes it already exists in the cluster.
knative:
  enabled: true

kubevirt:
  enabled: true
# --- End platform dependency toggles ---------------------------------------


identity:
  replicaCount: 2
  image:
    repository: identity
  service:
    port: 8083
    httpPort: 8093

compute:
  replicaCount: 2
  image:
    repository: compute
  service:
    port: 8084
    httpPort: 8094

storageClass:
  # Set createClass: true only when your cluster does not already have a
  # default StorageClass and you want dcloud to render one. Most users
  # should keep this false and rely on the cluster's default (e.g. rook's
  # `general` StorageClass with isDefault=true).
  createClass: false
  # Name of the StorageClass PostgreSQL persistence + KubeBlocks Clusters
  # bind to. Empty means "use the cluster's default StorageClass".
  className: ""
  # Only consulted when createClass: true.
  clusterID: rook-ceph
  pool: rbd

console:
  replicaCount: 2
  image:
    repository: console
  service:
    type: LoadBalancer
    port: 8080
  # Tenant-container zone (mirror of the top-level publicServiceDomain
  # so the console nginx can route *.{publicServiceDomain} to Knative).
  publicServiceDomain: example.com
  # The hostname the dcloud console itself is served under.
  publicHostname: cloud.example.com

project:
  replicaCount: 2
  image:
    repository: project
  service:
    port: 8081
    httpPort: 8091

container:
  replicaCount: 2
  image:
    repository: container
  service:
    port: 8082
    httpPort: 8092

storage:
  replicaCount: 2
  image:
    repository: storage
  service:
    port: 8085
    httpPort: 8095
  bucketStorageClass: rook-ceph-delete-bucket
  rgwEndpoint: ""

database:
  replicaCount: 2
  image:
    repository: database
  service:
    port: 8086
    httpPort: 8096
  # Storage class for KubeBlocks Clusters the database service creates.
  # Empty (default) means "use the cluster's default StorageClass".
  storageClass: ""
  # Set to a pre-created Secret name to bring your own DB credentials
  # instead of the auto-generated dcloud-database secret. The secret
  # must be type kubernetes.io/basic-auth with username/password plus
  # DCLD_DATABASE_URL and DCLD_DATABASE_MIGRATION_URL keys.
  externalSecret: ""
  # CloudNativePG-managed postgres cluster (see templates/postgres-cluster.yaml).
  postgres:
    replicaCount: 1
    storageSize: 20Gi
    # Empty means "use the cluster's default StorageClass".
    storageClass: ""

# Console publishing options. Set ingress.enabled: true to render an
# Ingress in addition to the Service. In that mode the browser reaches
# the console via the Ingress (typically ingress-nginx) with TLS
# terminated by cert-manager.
ingress:
  enabled: false
  className: nginx
  tls:
    enabled: true
    # cert-manager ClusterIssuer to request certs from.
    clusterIssuer: letsencrypt-prod
  # Tenant *.<publicServiceDomain> traffic is forwarded to Knative's
  # kourier ingress so Knative can match Routes by Host. knative-operator
  # installs kourier into the knative-serving namespace (not kourier-system
  # like the raw kourier YAML would). Set enabled: false if you serve
  # tenants some other way.
  tenantWildcard:
    enabled: true
    upstreamService: kourier.knative-serving.svc.cluster.local
    upstreamPort: 80
