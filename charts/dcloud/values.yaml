image:
  registry: ghcr.io
  # Container registry namespace (org or user) under which the dcloud
  # component images are published. Override for private mirrors or forks.
  repositoryOwner: dcloud
  pullPolicy: Always
  tag: latest

# Public DNS zone that tenant container services are exposed under
# (e.g. hello.example.com resolves to the Knative service). Override to
# your own zone.
publicServiceDomain: example.com

# --- Platform dependency toggles --------------------------------------------
# Each block below controls a bundled sub-chart (see Chart.yaml `dependencies`)
# and any static manifests rendered under templates/inline-manifests.yaml.
# Set `enabled: false` to bring your own installation of that component;
# dcloud then assumes it already exists in the cluster.
istio:
  enabled: true

knative:
  enabled: true
  # KnativeServing CR rendered from manifests/knative-serving.yaml so the
  # knative-operator has a Serving instance to reconcile once the operator
  # sub-chart lands.
# --- End platform dependency toggles ---------------------------------------


identity:
  replicaCount: 2
  image:
    repository: identity
  service:
    port: 8083
    httpPort: 8093

compute:
  replicaCount: 2
  image:
    repository: compute
  service:
    port: 8084
    httpPort: 8094

storageClass:
  # Set createClass: true only when your cluster does not already have a
  # default StorageClass and you want dcloud to render one. Most users
  # should keep this false and rely on the cluster's default (e.g. rook's
  # `general` StorageClass with isDefault=true).
  createClass: false
  # Name of the StorageClass PostgreSQL persistence + KubeBlocks Clusters
  # bind to. Empty means "use the cluster's default StorageClass".
  className: ""
  # Only consulted when createClass: true.
  clusterID: rook-ceph
  pool: rbd

console:
  replicaCount: 2
  image:
    repository: console
  service:
    type: LoadBalancer
    port: 8080
  # Tenant-container zone (mirror of the top-level publicServiceDomain
  # so the console nginx can route *.{publicServiceDomain} to Knative).
  publicServiceDomain: example.com
  # The hostname the dcloud console itself is served under.
  publicHostname: cloud.example.com

project:
  replicaCount: 2
  image:
    repository: project
  service:
    port: 8081
    httpPort: 8091

container:
  replicaCount: 2
  image:
    repository: container
  service:
    port: 8082
    httpPort: 8092

storage:
  replicaCount: 2
  image:
    repository: storage
  service:
    port: 8085
    httpPort: 8095
  bucketStorageClass: rook-ceph-delete-bucket
  rgwEndpoint: ""

database:
  replicaCount: 2
  image:
    repository: database
  service:
    port: 8086
    httpPort: 8096
  # Storage class for KubeBlocks Clusters the database service creates.
  # Empty (default) means "use the cluster's default StorageClass".
  storageClass: ""
  # Set to a pre-created Secret name to bring your own DB credentials
  # instead of the auto-generated dcloud-database secret. The secret
  # must contain the same keys (password/postgres-password/repmgr-password
  # /sr-check-password/admin-password/DCLD_DATABASE_URL/DCLD_DATABASE_MIGRATION_URL).
  externalSecret: ""

postgresql-ha:
  global:
    security:
      allowInsecureImages: true
    # Empty means "use the cluster's default StorageClass" - see also
    # storageClass.className at the top of this file.
    defaultStorageClass: ""
    postgresql:
      username: dcloud
      database: dcloud
      # References the secret rendered by templates/database-secret.yaml
      # (or the user-supplied one when database.externalSecret is set).
      existingSecret: dcloud-database
      repmgrUsername: repmgr
    pgpool:
      existingSecret: dcloud-database
  postgresql:
    image:
      repository: soldevelo/postgresql-repmgr
      tag: 17.6.0-debian-12-r0
    database: dcloud
    username: dcloud
    replicaCount: 2
    existingSecret: dcloud-database
    persistence:
      storageClass: ""
  pgpool:
    image:
      repository: soldevelo/pgpool
      tag: 4.6.3-debian-12-r0
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 375m

# Console publishing options. Set ingress.enabled: true to render an
# Ingress in addition to the Service. In that mode the browser reaches
# the console via the Ingress (typically ingress-nginx) with TLS
# terminated by cert-manager.
ingress:
  enabled: false
  className: nginx
  tls:
    enabled: true
    # cert-manager ClusterIssuer to request certs from.
    clusterIssuer: letsencrypt-prod
  # Tenant *.<publicServiceDomain> traffic is forwarded to istio-ingressgateway
  # so Knative can match Routes by Host. Set enabled: false if you serve
  # tenants some other way.
  tenantWildcard:
    enabled: true
    upstreamService: istio-ingressgateway.istio-system.svc.cluster.local
    upstreamPort: 80
