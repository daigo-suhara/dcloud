image:
  registry: ghcr.io
  # Container registry namespace (org or user) under which the dcloud
  # component images are published. Override for private mirrors or forks.
  repositoryOwner: dcloud
  pullPolicy: Always
  tag: latest

# Public DNS zone that tenant container services are exposed under
# (e.g. hello.example.com resolves to the Knative service). Override to
# your own zone.
publicServiceDomain: example.com

identity:
  replicaCount: 2
  image:
    repository: identity
  service:
    port: 8083

compute:
  replicaCount: 2
  image:
    repository: compute
  service:
    port: 8084

storageClass:
  createClass: true
  className: ceph-rbd
  clusterID: rook-ceph
  pool: rbd

console:
  replicaCount: 2
  image:
    repository: console
  service:
    type: LoadBalancer
    port: 8080
  # Tenant-container zone (mirror of the top-level publicServiceDomain
  # so the console nginx can route *.{publicServiceDomain} to Knative).
  publicServiceDomain: example.com
  # The hostname the dcloud console itself is served under.
  publicHostname: cloud.example.com

project:
  replicaCount: 2
  image:
    repository: project
  service:
    port: 8081

container:
  replicaCount: 2
  image:
    repository: container
  service:
    port: 8082

storage:
  replicaCount: 2
  image:
    repository: storage
  service:
    port: 8085
  bucketStorageClass: rook-ceph-delete-bucket
  rgwEndpoint: ""

database:
  replicaCount: 2
  image:
    repository: database
  service:
    port: 8086
  storageClass: ceph-rbd

postgresql-ha:
  global:
    security:
      allowInsecureImages: true
    defaultStorageClass: ceph-rbd
    postgresql:
      username: dcloud
      database: dcloud
      existingSecret: dcloud-database
      repmgrUsername: repmgr
    pgpool:
      existingSecret: dcloud-database
  postgresql:
    image:
      repository: soldevelo/postgresql-repmgr
      tag: 17.6.0-debian-12-r0
    database: dcloud
    username: dcloud
    replicaCount: 2
    existingSecret: dcloud-database
    persistence:
      storageClass: ceph-rbd
  pgpool:
    image:
      repository: soldevelo/pgpool
      tag: 4.6.3-debian-12-r0
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 375m
