apiVersion: v2
name: dcloud
description: A GCP-like cloud platform running on Kubernetes.
type: application
version: 0.2.0
appVersion: "0.2.0"

# Umbrella chart pattern: platform-level dependencies ship with dcloud so
# `helm install dcloud` reaches a working state without asking operators
# to pre-provision separate charts. Only the minimum set required for
# dcloud's container feature (istio + knative) is bundled by default.
# Adding kubevirt (compute), kubeblocks (managed DB), or envoy-gateway
# is out of scope for the umbrella and remains a bring-your-own step.
dependencies:
  - name: postgresql-ha
    version: 16.3.2
    repository: oci://registry-1.docker.io/bitnamicharts

  - name: base
    alias: istio-base
    version: 1.30.3
    repository: https://istio-release.storage.googleapis.com/charts
    condition: istio.enabled

  - name: istiod
    version: 1.30.3
    repository: https://istio-release.storage.googleapis.com/charts
    condition: istio.enabled

  - name: gateway
    alias: istio-ingressgateway
    version: 1.30.3
    repository: https://istio-release.storage.googleapis.com/charts
    condition: istio.enabled

  - name: knative-operator
    version: 1.16.2
    repository: https://knative.github.io/operator
    condition: knative.enabled
