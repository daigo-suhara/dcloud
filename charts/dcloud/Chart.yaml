apiVersion: v2
name: dcloud
description: A GCP-like cloud platform running on Kubernetes.
type: application
version: 0.3.0
appVersion: "0.3.0"

# Umbrella chart pattern: platform-level dependencies ship with dcloud so
# `helm install dcloud` reaches a working state without asking operators
# to pre-provision separate charts.
#
# Only knative-operator is a Helm sub-chart. Kourier ships as raw YAML
# (Knative net-kourier has no official chart) and lands via
# templates/inline-manifests.yaml. Istio is intentionally not bundled;
# Kourier is Knative Serving's default ingress and drops the whole
# service-mesh footprint dcloud does not use.
dependencies:
  - name: postgresql-ha
    version: 16.3.2
    repository: oci://registry-1.docker.io/bitnamicharts

  - name: knative-operator
    version: 1.16.2
    repository: https://knative.github.io/operator
    condition: knative.enabled
