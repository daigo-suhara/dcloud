apiVersion: v2
name: dcloud
description: A GCP-like cloud platform running on Kubernetes.
type: application
version: 0.3.0
appVersion: "0.3.0"

# Umbrella chart pattern: platform-level dependencies ship with dcloud so
# `helm install dcloud` reaches a working state without asking operators
# to pre-provision separate charts.
#
# cloudnative-pg is the CNPG operator that manages the dcloud Cluster
# defined in templates/postgres-cluster.yaml.
# knative-operator installs Knative Serving. Kourier (Knative's default
# ingress) ships as raw YAML via templates/inline-manifests.yaml because
# net-kourier has no official Helm chart.
# Istio is intentionally not bundled.
dependencies:
  - name: cloudnative-pg
    version: 0.28.0
    repository: https://cloudnative-pg.github.io/charts

  - name: knative-operator
    version: 1.16.2
    repository: https://knative.github.io/operator
    condition: knative.enabled

  - name: kubeblocks
    version: 1.0.2
    repository: https://apecloud.github.io/helm-charts
    condition: kubeblocks.enabled
